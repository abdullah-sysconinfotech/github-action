name: Build Next JS

on: 
 push:
   branches: [ master ]

jobs:
  buildNext:
   runs-on: ubuntu-latest

   concurrency:
     group: deploy
     cancel-in-progress: true

   steps:
     - name: Checkout
       uses: actions/checkout@v6.1.0
       
     - name: Setup Node Js
       uses: actions/setup-node@v6.5.0
       with:
        node-version: 22.x
        cache: 'npm'
        
     - name: Install Dependencies
       run: npm install

     - name: Build Next JS
       run: npm run build

     - name: Deploy App
       run: echo 'Deploying App...'
